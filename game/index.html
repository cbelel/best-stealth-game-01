<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lantern Archive</title>
  <style>
    body {
      margin: 0;
      background: #060913;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      border: 2px solid #1e293b;
      border-radius: 8px;
      background: #030509;
    }
    canvas {
      display: block;
      background: #030509;
      cursor: crosshair;
      border-radius: 6px;
    }
    #status {
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="status">ready</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
